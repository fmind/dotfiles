# chezmoi:modify-template
{{- $managedConfig := fromToml `
[cli]
# Grok automatically checks and updates itself in the background to the latest
# version without manual version pinning in dotfiles.
auto_update = true

[features]
# feedback is a separate sink from telemetry, so silencing one leaves the other on.
# Matches Claude Code (feedbackSurveyRate = 0) and Codex (otel exporters = "none").
feedback = false
# lsp_tools exposes the "lsp" tool; ~/.grok/lsp.json declares the servers it drives.
lsp_tools = true
telemetry = false
# Opt-in: compaction prefires a second pass, so a long session keeps more context.
two_pass_compaction = true

# Cross-session memory is experimental and off by default. Enabling it here matches the
# memory already on for Claude Code (autoMemoryEnabled) and Codex ([features] memories).
# Keyword recall (FTS5) works unauthenticated; vector recall adds an embedding call.
[memory]
enabled = true

[models]
# Only the effort is pinned, and "default" is pruned below rather than left alone: Grok
# persists whatever /model selects into this file, so leaving it would freeze the machine
# on today's model instead of following Grok's own default as it tracks each new release.
default_reasoning_effort = "xhigh"

[ui]
compact_mode = true
fork_secondary_model = "grok-4.5"
max_thoughts_width = 120
# The config surface for always-approve. The [ui] yolo bool is a second, redundant spelling
# of the same behaviour, so it is left out rather than pinned to a contradicting value.
permission_mode = "always-approve"
render_mermaid = "on"
screen_mode = "fullscreen"
show_timeline = false
# simple_mode is the prompt editor and vim_mode is scrollback navigation, and both are on
# vim here so Grok matches Claude Code (editorMode), Codex (vim_mode_default), and readline
# (dot_inputrc). Grok flags prompt vim editing as experimental: an empty prompt starts in
# normal mode with focus on the scrollback, so "i" is what begins typing.
simple_mode = false
theme = "groknight"
vim_mode = true
voice_stt_language = "fr"

# Grok's bash defaults truncate a "mise run test" run twice over: the 120s timeout kills it
# long before it finishes, and the 20 KB output cap cuts off the failure that matters. Both
# are raised to the budget Claude Code already runs on (BASH_DEFAULT_TIMEOUT_MS = 300000).
[toolset.bash]
output_byte_limit = 131072
timeout_secs = 300.0

# Grok's own documentation states both true and false as the default for this key, so it
# is pinned rather than inherited. False keeps gitignored-but-wanted files readable:
# the built dot binary, skills/local-*, and every other ignored path in this checkout.
[tools]
respect_gitignore = false

# web_fetch is enabled through GROK_WEB_FETCH in the fish environment. Off-allowlist
# domains normally prompt, and always-approve answers those prompts, so the SSRF guard
# is what actually bounds the tool: loopback stays unreachable, and private, link-local,
# and cloud-metadata addresses stay blocked whatever this is set to.
[toolset.web_fetch]
allow_local = false

# Grok reaches the shared persona and skills through its own ~/.grok symlinks, so every
# vendor-compatibility *scan* is off. Left on (the default), Grok would load
# ~/.agents/AGENTS.md a second time via ~/.claude/CLAUDE.md, and would run Claude Code's
# hooks inside a Grok turn: desktop alerts labelled "Claude Code", and a
# "dot agent hook session claude" that cannot resolve a Grok session ID.
# The "sessions" cell is staged upstream with no scanner behind it yet; pinning it now
# stops foreign-session discovery from switching itself on the day a consumer ships.
# Claude Code's *permission* rules are a different surface from compat.claude.rules (which
# only governs ~/.claude/rules/ scanning), and they have no compat toggle at all: Grok
# keeps reading ~/.claude/settings.json and inherits its bypassPermissions default.
[compat.claude]
agents = false
hooks = false
mcps = false
rules = false
sessions = false
skills = false

# Codex's other cells are reserved and inert upstream, so "sessions" is the only one to pin.
[compat.codex]
sessions = false

[compat.cursor]
agents = false
hooks = false
mcps = false
rules = false
sessions = false
skills = false

` -}}
{{- $base := env "FKF_BASE" | default (joinPath .chezmoi.homeDir "fmind/brain") -}}
{{- $_ := set $managedConfig "mcp_servers" (dict "fkf" (dict "command" "fkf" "args" (list "mcp" "serve" "--base" $base) "enabled" true)) -}}
{{- /* Dropping a key from the managed block above only stops managing it -- the merge would
       still carry whatever Grok last wrote. These three have to be pruned to actually go:
       privacy, which Grok wrote and a later version dropped, so "grok inspect" now reports
       it as an unrecognized config key; models.default, per the [models] note; and ui.yolo,
       the redundant second spelling of permission_mode. */ -}}
{{- includeTemplate "toml-merge.tmpl" (dict
      "stdin" .chezmoi.stdin
      "managed" $managedConfig
      "defaults" dict
      "prune" (list "models.default" "privacy" "ui.yolo")) -}}
