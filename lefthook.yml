glob_matcher: doublestar
pre-commit:
  parallel: false
  commands:
    format:dprint:
      glob: "**/*.{json,jsonc,md,toml,yaml,yml}"
      priority: 10
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    format:go:
      glob: "**/*.go"
      exclude:
        - "skills/**/*.go"
        - ".agents/tmp/**/*.go"
      priority: 10
      run: mise run format:go {staged_files}
      stage_fixed: true
    format:lua:
      glob: "**/*.lua"
      priority: 10
      run: mise run format:lua {staged_files}
      stage_fixed: true
    format:python:
      glob: "**/*.py"
      exclude:
        - "skills/**/*.py"
        - ".agents/tmp/**/*.py"
      priority: 10
      run: mise run format:python {staged_files}
      stage_fixed: true
    format:shell:
      glob: "**/*.sh"
      priority: 10
      run: mise run format:shell {staged_files}
      stage_fixed: true
    check:leaks:
      priority: 20
      run: mise run check:leaks --staged
    check:
      priority: 30
      run: mise run check
post-commit:
  commands:
    deploy:
      # The `dot` on PATH is a chezmoi-deployed copy, so it silently lags the moment
      # a commit changes what it is built from — and every later check runs *through*
      # that stale copy. Redeploy here, where the skew is created. Only the binary is
      # applied: a full apply would also rewrite unrelated, app-managed dotfiles.
      # Git ignores this hook's exit status, so a failure reports without blocking.
      run: |
        git diff-tree --no-commit-id --name-only -r HEAD |
          grep -E '^dot/(.*\.go|go\.(mod|sum))$' |
          grep -qv '_test\.go$' || exit 0
        # --force: the task's mtime check cannot see the VCS stamp, so a binary
        # built from the same files pre-commit still carries a dirty/old revision.
        mise run --force build
        chezmoi apply ~/.local/bin/dot

pre-push:
  commands:
    test:
      run: mise run test
