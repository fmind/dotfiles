pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{typ,json,md,toml,yaml,yml}"
      priority: 10
      run: mise run format {staged_files}
      stage_fixed: true
    check:leaks:
      priority: 20
      run: mise run check:leaks --staged
    check:
      priority: 30
      run: mise run check
pre-push:
  commands:
    test:
      run: mise run test
