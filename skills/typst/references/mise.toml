[settings.task]
run_auto_install = false

[tools]
dprint = "latest"
gitleaks = "latest"
lefthook = "latest"
typst = "latest"
typstyle = "latest"

[tasks.all]
alias = "a"
description = "Run the full gate (format, check, test, build)"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Compile the document to a distributable PDF"
sources = ["*.typ", "assets/**/*", "fonts/**/*"]
outputs = ["dist/main.pdf"]
run = ["mkdir -p dist", "typst compile main.typ dist/main.pdf"]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:doc", "check:format", "check:leaks"]

[tasks."check:doc"]
alias = "cv"
description = "Compile to a scratch PDF so document errors fail fast"
run = ["mkdir -p tmp", "typst compile main.typ tmp/check.pdf"]

[tasks."check:format"]
alias = "cf"
description = "Check Typst and config formatting (typstyle + dprint)"
run = ["typstyle --check .", "dprint check"]

[tasks."check:leaks"]
alias = "cs"
description = "Audit staged changes, the working tree, or recent commits for leaked secrets (gitleaks)"
run = """
sh -c '
if [ "$#" -gt 0 ]; then
  gitleaks git --verbose "$@"
elif git rev-parse --verify HEAD >/dev/null 2>&1; then
  gitleaks git --log-opts="--max-count=100" --verbose
else
  gitleaks dir . --verbose
fi
' --
"""

[tasks.format]
alias = "f"
description = "Format Typst sources and configuration"
depends = ["format:typst", "format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

# Split from format:dprint so a commit touching only .typ files never hands dprint
# an empty file list (it exits 14 with "No files found").
[tasks."format:typst"]
description = "Format Typst sources in place (typstyle)"
run = "typstyle -i ."

[tasks.install]
alias = "i"
description = "Install Git hooks using Lefthook"
run = "lefthook install"

[tasks.test]
alias = "t"
description = "Compile-verify the document (pre-push gate)"
depends = ["check:doc"]

[tasks.watch]
alias = "w"
description = "Recompile the PDF on every change (live preview)"
run = ["mkdir -p dist", "typst watch main.typ dist/main.pdf"]
