name: CD
on:
  push:
    tags:
      - 'v*' # Trigger on semver version tags (e.g., v1.0.0)
# Default to read-only; each deploy job widens only what it actually needs.
permissions:
  contents: read
jobs:
  # Option 1: Go Application (build container with ko, publish to GHCR, sign keyless)
  deploy-go:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY_GO == 'true' }} # set repo/org variable ENABLE_DEPLOY_GO=true to enable
    permissions:
      contents: read
      packages: write # required to push to GitHub Container Registry (GHCR)
      id-token: write # keyless cosign signing: the workflow identity signs the image digest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # registry auth is separate; git stays read-only
      - name: Install tools using mise
        uses: jdx/mise-action@v4
        with:
          cache: false # a poisoned tool cache must never reach release artifacts
      - name: Set lower-case registry path
        run: |
          echo "IMAGE_REPOSITORY=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE_REPOSITORY }}
        run: |
          # build:image is `go tool ko build ./cmd/<slug> --bare` from mise.toml (containerize skill);
          # mise appends the flags below to it. $GITHUB_REF_NAME comes from the runner env: an
          # inline github.ref_name expansion would let a crafted tag inject shell code, even in
          # comments. --bare names the image exactly KO_DOCKER_REPO, so --tags is safe only with
          # a single import path (ko warns it may misbehave with several).
          mkdir -p tmp
          mise run build:image \
            --image-refs tmp/refs.txt \
            --platform=linux/amd64,linux/arm64 \
            --tags=latest,"$GITHUB_REF_NAME"
      - name: Sign the image digest
        # tmp/refs.txt holds the digest reference ko published (one line for one import path);
        # cosign is pinned in mise.toml [tools], --yes skips the interactive prompt.
        run: cosign sign --yes "$(cat tmp/refs.txt)"
  # Option 2: Python Package (build and publish package to PyPI)
  deploy-python-pypi:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY_PYPI == 'true' }} # set repo/org variable ENABLE_DEPLOY_PYPI=true to enable
    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing via OIDC
    # environment: pypi # Configure trusted publishing on PyPI for this environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # PyPI auth is OIDC; git stays read-only
      - name: Install tools using mise
        uses: jdx/mise-action@v4
        with:
          cache: false # a poisoned tool cache must never reach release artifacts
      - name: Build Package
        run: mise run build # task defined in mise.toml
      - name: Publish to PyPI
        run: mise run publish # task defined in mise.toml
  # Option 3: Python Application (build container with Dockerfile, publish to GHCR, sign keyless)
  deploy-python-container:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY_CONTAINER == 'true' }} # set repo/org variable ENABLE_DEPLOY_CONTAINER=true to enable
    permissions:
      contents: read
      packages: write # required to push to GitHub Container Registry (GHCR)
      id-token: write # keyless cosign signing: the workflow identity signs the image digest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # registry auth is separate; git stays read-only
      - name: Install tools using mise
        uses: jdx/mise-action@v4
        with:
          cache: false # a poisoned tool cache must never reach release artifacts
      - name: Set lower-case registry path
        run: |
          echo "IMAGE_REPOSITORY=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }} # through env, never inline in the script
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${DIGEST}"
