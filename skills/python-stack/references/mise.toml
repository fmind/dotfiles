[env]
_.file = ".env"

[settings.task]
run_auto_install = false

[tools]
dprint = "latest"
gitleaks = "latest"
uv = "latest"

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build Python distribution artifacts"
run = "uv build"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:format",
  "check:leaks",
  "check:lint",
  "check:types",
  "check:vuln",
]

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv run validate-pyproject pyproject.toml",
  "uv run ruff format --check",
  "dprint check",
  "uv lock --check",
]

[tasks."check:leaks"]
alias = "cs"
description = "Audit staged changes, the working tree, or recent commits for leaked secrets (gitleaks)"
run = """
sh -c '
if [ "$#" -gt 0 ]; then
  gitleaks git --verbose "$@"
elif git rev-parse --verify HEAD >/dev/null 2>&1; then
  gitleaks git --log-opts="--max-count=100" --verbose
else
  gitleaks dir . --verbose
fi
' --
"""

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run ruff check"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan dependencies for vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = [
  "find . -type f -name '*.py[co]' -delete",
  "find . -type d -name __pycache__ -exec rm -rf {} +",
  "rm -rf .cache .pytest_cache .ruff_cache .coverage htmlcov dist docs",
]

[tasks.coverage]
alias = "v"
description = "Write an HTML coverage report"
depends = ["test"]
run = "uv run coverage html"

[tasks.docs]
alias = "d"
description = "Generate HTML docs (pdoc)"
run = "uv run pdoc -o docs <package>"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Format Python sources and imports (ruff)"
run = [
  "uv run ruff check --select=I --fix --force-exclude",
  "uv run ruff format --force-exclude",
]

[tasks.install]
alias = "i"
description = "Install development dependencies"
run = ["uv sync", "uv run lefthook install"]

[tasks.publish]
alias = "p"
description = "Publish distribution artifacts to PyPI"
run = "uv publish"

[tasks.test]
alias = "t"
description = "Run offline tests with the coverage gate"
run = 'uv run pytest -m "not integration" --cov --cov-fail-under=85'

[tasks."test:integration"]
alias = "ti"
description = "Run opt-in Docker-backed integration tests"
run = "uv run pytest -m integration"

[tasks."test:watch"]
alias = "tw"
description = "Run offline tests in watch mode"
run = 'uv run pytest-watcher . -m "not integration"'

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions"
run = "uv sync --upgrade"

# Web form (granian). CLI projects: replace with `uv run <slug>`; libraries:
# `mise run test:watch`; agent projects: `uvx google-agents-cli playground`.
[tasks.watch]
alias = "w"
description = "Run the dev server with live reload"
run = "uv run granian --interface asgi --reload <package>:app"
