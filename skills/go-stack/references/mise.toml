[env]
APP_NAME = "<slug>"

[settings.task]
run_auto_install = false

[tools]
air = "latest"
dprint = "latest"
gitleaks = "latest"
go = "latest"
golangci-lint = "latest"
gotestsum = "latest"
lefthook = "latest"
# esbuild is a Go program, so the go backend builds the real binary from source —
# the npm package is only a distribution wrapper. The stack stays Node-free.
"go:github.com/evanw/esbuild/cmd/esbuild" = "latest"
# Tailwind v4 standalone CLI (web projects only)
"github:tailwindlabs/tailwindcss" = "latest"

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Compile production binary"
depends = ["build:go"]

# On-demand: needs `ko` from the containerize skill (`go get -tool github.com/google/ko`).
[tasks."build:image"]
description = "Build production OCI image (ko)"
depends = ["build:templ", "build:css", "build:js"]
run = "go tool ko build ./cmd/$APP_NAME --bare"

[tasks."build:css"]
description = "Compile and minify Tailwind CSS"
sources = ["assets/css/styles.css", "**/*.go", "**/*.templ"]
outputs = ["static/css/dist.css"]
run = "tailwindcss -i assets/css/styles.css -o static/css/dist.css --minify"

[tasks."build:js"]
description = "Bundle and minify browser JavaScript (esbuild)"
# One entry point, one output: esbuild follows the import graph from app.js, so
# adding a module under assets/js/ needs no task change. IIFE (not ESM) keeps the
# bundle loadable from a plain nonce'd <script> tag with no CORS or MIME setup.
sources = ["assets/js/**/*.js"]
outputs = ["static/js/dist.js"]
run = "esbuild assets/js/app.js --bundle --minify --format=iife --target=es2022 --outfile=static/js/dist.js"

[tasks."build:go"]
description = "Compile production Go binary"
depends = ["build:templ", "build:css", "build:js"]
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = ["bin/{{env.APP_NAME}}"]
run = "go build -o bin/$APP_NAME ./cmd/$APP_NAME"

[tasks."build:templ"]
description = "Generate Go code from Templ templates"
sources = ["**/*.templ"]
outputs = ["**/*_templ.go"]
run = "go tool templ generate"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:lint", "check:vuln", "check:format", "check:leaks"]

[tasks."check:leaks"]
alias = "cs"
description = "Audit staged changes, the working tree, or recent commits for leaked secrets (gitleaks)"
run = """
sh -c '
if [ "$#" -gt 0 ]; then
  gitleaks git --verbose "$@"
elif git rev-parse --verify HEAD >/dev/null 2>&1; then
  gitleaks git --log-opts="--max-count=100" --verbose
else
  gitleaks dir . --verbose
fi
' --
"""

[tasks."check:format"]
alias = "cf"
description = "Check config/markup formatting (dprint)"
run = "dprint check"

[tasks."check:lint"]
alias = "cl"
description = "Lint Go sources (golangci-lint)"
run = "golangci-lint run ./..."

[tasks."check:vuln"]
alias = "cv"
description = "Scan Go code for vulnerabilities (govulncheck)"
run = "go tool govulncheck ./..."

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = "rm -rf bin/ coverage.out tmp/ static/css/dist.css static/js/dist.js"

[tasks.coverage]
alias = "v"
description = "View test coverage in terminal"
depends = ["test"]
run = "go tool cover -func=coverage.out"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:go", "format:templ", "format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."format:go"]
description = "Format Go sources and imports (goimports + gofumpt)"
# Flags must mirror .golangci.yml: `local-prefixes` and `extra-rules` are format policy,
# so without them `format` writes a style that `check` then rejects.
run = ["go tool goimports -local <import_path> -w .", "go tool gofumpt -extra -w ."]

[tasks."format:templ"]
description = "Format Templ templates"
run = "go tool templ fmt ."

[tasks.install]
alias = "i"
description = "Install development dependencies"
depends = ["install:hooks", "install:vendor"]

[tasks."install:go"]
description = "Tidy Go modules and download dependencies"
depends = ["build:templ"]
run = "go mod tidy"

[tasks."install:hooks"]
description = "Install Git hooks using Lefthook"
depends = ["install:go"]
run = "lefthook install"

[tasks."install:vendor"]
description = "Download and vendor static assets (skips when already vendored)"
depends = ["install:go"]
sources = ["scripts/vendor.go"]
outputs = ["static/vendor/htmx.min.js", "static/vendor/alpine.min.js"]
run = "go run scripts/vendor.go"

[tasks.test]
alias = "t"
description = "Run the test suite (gotestsum)"
depends = ["build:templ"]
run = "gotestsum --format pkgname -- -race -coverprofile=coverage.out ./..."

[tasks."test:watch"]
alias = "tw"
description = "Run the test suite in watch mode"
depends = ["build:templ"]
run = "gotestsum --watch --format pkgname -- -race -coverprofile=coverage.out ./..."

[tasks.watch]
alias = "w"
description = "Run the dev server with live reload"
depends = ["watch:css", "watch:js", "watch:air"]

[tasks."watch:air"]
hide = true
run = "air"

[tasks."watch:css"]
hide = true
run = "tailwindcss -i assets/css/styles.css -o static/css/dist.css --watch"

# Rewrites static/js/dist.js on every change under assets/js/, which air sees as
# an embedded-asset change and rebuilds the binary for (see .air.toml).
[tasks."watch:js"]
hide = true
run = "esbuild assets/js/app.js --bundle --minify --format=iife --target=es2022 --outfile=static/js/dist.js --watch"
