kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Same host ports as the k3d config, so swapping engines does not move the URLs
    # you have already bookmarked or wired into a project.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8042
        protocol: TCP
      - containerPort: 443
        hostPort: 8043
        protocol: TCP
  - role: worker
