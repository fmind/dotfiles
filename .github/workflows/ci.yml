name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      # `check:leaks` scans commits, not just the working tree, and is capped at
      # the last 10 (see mise.toml). Fetch exactly that depth so CI and the local
      # task cover the same commits instead of cloning history nothing reads.
      - name: Checkout recent history
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Trust repository
        run: mise trust -y mise.toml && mise trust -y dot/mise.toml
      - name: Run formatters
        run: mise run format
      - name: Run checkers
        run: mise run check
      - name: Run testers
        run: mise run test
      - name: Verify clean tree
        run: test -z "$(git status --porcelain)"
