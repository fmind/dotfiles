name: CD
# Triggered when an annotated release tag (v*) is pushed to origin.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # Only this job creates the release, so the write scope stops here.
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # $GITHUB_REF_NAME comes from the runner env: expanding ${{ github.ref_name }}
        # inline would let a crafted tag inject shell code (zizmor: template-injection).
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
