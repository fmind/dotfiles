name: CD
# Dispatch-only on purpose. `dot release` prepares, validates, and pushes the
# release commit, then dispatches this workflow with that exact SHA, so it is the
# single owner of when a release publishes. A `push` trigger would fire a second,
# redundant run for the same commit alongside the dispatched one.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full release commit SHA prepared on main
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: cd-${{ inputs.commit }}
  cancel-in-progress: false
jobs:
  publish:
    name: Gate, tag, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout prepared commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Configure annotated tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish after exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./dot/cmd/dot release publish --commit '${{ inputs.commit }}'
