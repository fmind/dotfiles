name: CD
# Triggered when an annotated release tag (v*) is pushed to origin.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --verify-tag --generate-notes --title '${{ github.ref_name }}'
