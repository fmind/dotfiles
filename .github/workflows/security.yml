name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          cache: true
      - name: Trust repository
        run: mise trust -y mise.toml && mise trust -y dot/mise.toml
      - name: Scan full checkout
        run: trivy --config trivy.yaml fs .
      - name: Scan complete Git history
        run: gitleaks git --redact=100 --verbose
