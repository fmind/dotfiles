timeout: 15m
exit-code: 1
severity:
  - HIGH
  - CRITICAL
scan:
  scanners:
    - license
    - misconfig
    - secret
    - vuln
  skip-dirs:
    - .agents
    - .antigravitycli
    - .claude
    - .gemini
    - .git
    - .ruff_cache
    - .venv
    - dot_local
vulnerability:
  ignore-unfixed: true
