[env]
# Relative to this config's directory, so the repo keeps working from any clone
# path — the freshly built `executable_dot` is what the tasks below invoke.
_.path = "dot_local/bin"

[settings]
# Mirrors the per-backend provenance switches of the home config: without them
# this config alone (CI, or any run that does not load the home config) records
# a different provenance in mise.lock than a local run, and the lockfile flaps.
aqua.cosign = false
aqua.github_attestations = false
aqua.minisign = false
aqua.slsa = false
github.github_attestations = false
github.slsa = false
github_attestations = false
locked_verify_provenance = false
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
slsa = false

[settings.task]
run_auto_install = false

[task_config]
# Every task in this file assumes the repo root. mise otherwise defaults tasks to
# MISE_PROJECT_ROOT, which climbs to `$HOME` because `~/.config/mise/config.toml`
# is itself a per-directory config name — so `$HOME` outranks this repo as project
# root. Pinning to config_root (this file's directory) is cwd-independent, unlike
# `{{cwd}}`, which breaks the moment a task is invoked from a subdirectory.
dir = "{{config_root}}"

[tools]
"aqua:fish-shell/fish-shell" = "4"
actionlint = "latest"
chezmoi = "latest"
dprint = "latest"
gh = "latest"
gitleaks = "latest"
go = "latest"
golangci-lint = "latest"
gotestsum = "latest"
jq = "latest"
lefthook = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
trivy = "latest"
zizmor = "latest"

# ─────────────────────────────────────────────────────────────────────────────
# Common tasks — the canonical vocabulary that agents, git hooks, and CI reuse.
# ─────────────────────────────────────────────────────────────────────────────

[tasks.all]
alias = "a"
description = "Run the full CI gate locally (format, check, test, build)"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the dot CLI binary"
run = "go build -C dot -o ../dot_local/bin/executable_dot ./cmd/dot"
sources = ["dot/go.mod", "dot/go.sum", "dot/**/*.go"]
outputs = ["dot_local/bin/executable_dot"]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:actions",
  "check:chezmoi",
  "check:format",
  "check:docs",
  "check:go",
  "check:python",
  "check:shell",
  "check:leaks",
  "check:lua",
  "check:scan",
  "check:skills",
  "check:tools",
]

[tasks."check:actions"]
alias = "ca"
description = "Validate GitHub Actions workflows and Dependabot config"
# zizmor audits dependabot.yml too, so point it at .github/ rather than only
# workflows/ -- the narrower path silently hid every dependabot finding.
run = ["actionlint", "zizmor --offline .github/"]

[tasks."check:chezmoi"]
alias = "cc"
description = "Validate rendered chezmoi source in an isolated destination"
run = """
render_config="$(mktemp -d)"
render_destination="$(mktemp -d)"
trap 'rm -rf "$render_destination" "$render_config"' EXIT
chezmoi init --source "$PWD" --config-path "$render_config/chezmoi.toml" --promptDefaults
chezmoi apply --dry-run --force --source "$PWD" --destination "$render_destination" --config "$render_config/chezmoi.toml" --exclude=encrypted
"""

[tasks."check:format"]
alias = "cf"
description = "Check config/markup formatting (dprint)"
run = "dprint check"

[tasks."check:docs"]
alias = "co"
description = "Validate agent documentation against live commands and paths"
run = "go test -C dot -run '^TestDocumentationContract$' ."

[tasks."check:go"]
alias = "cg"
description = "Lint and vuln-scan the Go module (dot/)"
run = ["mise -C dot run check:lint", "mise -C dot run check:vuln"]

[tasks."check:leaks"]
alias = "cl"
description = "Audit recent commits for leaked secrets (gitleaks)"
# 100 commits is the window the gitleaks skill publishes and ci.yml fetches;
# it costs ~3s, and full history stays in the scheduled security.yml job.
run = "gitleaks git --log-opts=\"--max-count=100\" --verbose"

[tasks."check:lua"]
alias = "cu"
description = "Check Neovim Lua formatting (stylua)"
run = "stylua --check dot_config/nvim"

[tasks."check:python"]
alias = "cp"
description = "Lint Python sources (ruff)"
run = "ruff check"

[tasks."check:scan"]
alias = "ct"
description = "Scan dependencies, IaC, licenses, and secrets (Trivy)"
run = "trivy --config trivy.yaml fs --tf-vars skills/terraform-stack/references/terraform.example.tfvars ."

[tasks."check:shell"]
alias = "cs"
description = "Lint shell scripts, including chezmoi-templated ones (shellcheck)"
run = """
git ls-files '*.sh' | xargs -r shellcheck
for template in $(git ls-files '*.sh.tmpl'); do
  echo "In $template:"
  # Render first instead of piping: task scripts run without pipefail, so a
  # template that fails to render would feed shellcheck an empty script and
  # pass. A failed substitution aborts the task instead.
  rendered="$(chezmoi execute-template < "$template")"
  printf '%s\\n' "$rendered" | shellcheck --external-sources --shell=bash -
done
"""

[tasks."check:skills"]
alias = "ck"
description = "Validate first-party skill publisher compatibility"
# Scoped to skills/: from the repo root, `gh skill publish` never validates
# .agents/skills/ anyway — it only warns that the directory looks like an agent's
# installed-skills cache and should be gitignored. Those skills are
# first-party and deliberately tracked, so point the publisher at the directory
# it actually publishes. Repository-owned contract and routing tests live under
# the canonical test task so `mise run all` executes them exactly once.
run = "gh skill publish --dry-run skills"

[tasks."check:tools"]
alias = "cw"
description = "Validate mise tasks and installed tool ownership"
# mise.lock proves that what is *declared* installs reproducibly; nothing proved the
# converse, which is how orphan installs accumulate unnoticed. Only fully untracked
# tools fail here -- a superseded version of a declared tool is benign upgrade residue
# that `mise prune` clears on its own, and failing on it would make the gate noisy.
run = """
mise tasks validate
mise -C dot tasks validate
orphans=$(mise prune --dry-run 2>&1 | grep 'no tracked config or tool stub requires' || true)
if [ -n "$orphans" ]; then
  printf '%s\n' "$orphans"
  printf 'Untracked tools installed above: declare them in mise, or run `mise prune`.\n' >&2
  exit 1
fi
"""

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = [
  "format:dprint",
  "format:go",
  "format:lua",
  "format:python",
  "format:shell",
]

[tasks."format:dprint"]
alias = "fd"
description = "Format JSON, Markdown, TOML, YAML with dprint"
# --allow-no-files: the pre-commit hook passes staged paths, and a commit that
# stages only files dprint cannot claim (lockfiles) must not fail the hook.
run = "dprint fmt --allow-no-files"

[tasks."format:go"]
alias = "fg"
description = "Format Go sources and imports (goimports + gofumpt)"
run = ["go tool goimports -local dot -w dot", "go tool gofumpt -extra -w dot"]

[tasks."format:lua"]
alias = "fu"
description = "Format Neovim Lua sources (stylua)"
run = "stylua dot_config/nvim"

[tasks."format:python"]
alias = "fp"
description = "Format Python sources and imports (ruff)"
run = ["ruff check --select=I --fix .", "ruff format ."]

[tasks."format:shell"]
alias = "fs"
description = "Format shell scripts (shfmt)"
run = "git ls-files '*.sh' | xargs -r shfmt -w -i 2 -s"

[tasks.install]
alias = "i"
description = "Bootstrap a freshly initialized checkout"
run = [
  "mise trust -y mise.toml",
  "mise trust -y dot/mise.toml",
  "mise run tools",
  "mise run hooks",
  "mise run vim",
  "echo '✓ First-time bootstrap complete.'",
]

[tasks.test]
alias = "t"
description = "Run the dot CLI test suite (skill contracts included)"
run = "mise -C dot run test"

[tasks.watch]
alias = "w"
description = "Re-run the dot CLI test suite on every change"
run = "mise -C dot run test:watch"

# ─────────────────────────────────────────────────────────────────────────────
# Project management — chezmoi orchestration, tool sync, and bootstrap.
# Every alias starts with `m` so it can never shadow a common task above.
# ─────────────────────────────────────────────────────────────────────────────

[tasks.apply]
alias = "ma"
depends = ["build"]
description = "Apply dot with chezmoi"
run = "chezmoi apply --force"

[tasks.completions]
alias = "mg"
depends = ["build"]
description = "Generate Fish completions for core CLI tools and cached integrations"
run = "executable_dot completion"

[tasks.deploy]
alias = "me"
description = "Redeploy the dot CLI binary"
run = ["mise run --force build", "chezmoi apply --force ~/.local/bin/dot"]

[tasks.diff]
alias = "md"
description = "Show pending chezmoi diff"
run = "chezmoi diff --force"

[tasks.doctor]
alias = "mo"
description = "Run chezmoi/mise health checks"
run = ["chezmoi doctor", "mise doctor"]

[tasks.full]
alias = "mf"
depends = ["tools"]
description = "Apply dot and sync global tools"
run = "echo '✓ Dot deployed.'"

[tasks.hooks]
alias = "mh"
description = "Install repository Git hooks (Lefthook)"
run = "lefthook install"

[tasks.lock]
alias = "mk"
description = "Refresh the repo, home, and Neovim plugin lockfiles"
# LazyVim rewrites lazy-lock.json in place whenever plugins move, so it is
# re-added here alongside mise.lock: both are machine-written pins that only
# reach the repo through an explicit re-add.
run = [
  "mise lock --yes",
  "mise lock --global --yes",
  "chezmoi re-add --source \"$PWD\" ~/.config/mise/mise.lock",
  "chezmoi re-add --source \"$PWD\" ~/.config/nvim/lazy-lock.json",
]

[tasks.prune]
alias = "mp"
depends = ["build"]
description = "Remove unused tools, containers, and development caches"
run = "executable_dot prune --all=deep"

[tasks.release]
alias = "mr"
depends = ["build"]
description = "Prepare and dispatch an exact-head GitHub release"
run = "executable_dot release"

[tasks.tools]
alias = "mt"
description = "Install pinned tools for this repo and the global config"
# Locked installs must not collapse the checked-in cross-platform lock to the
# current host after `upgrade` has regenerated it.
run = [
  "mise --locked install -y",
  "mise run apply",
  "mise trust -y ~/.config/mise/config.toml",
  "mise -C \"$HOME\" --locked install -y",
  "mise run completions",
]

[tasks.trust]
alias = "mtr"
description = "Trust repo and home mise configs"
run = [
  "mise trust -y mise.toml",
  "mise trust -y dot/mise.toml",
  "mise trust -y ~/.config/mise/config.toml",
]

[tasks.upgrade]
alias = "mu"
description = "Upgrade mise tools to latest versions"
run = [
  "mise -C \"$HOME\" upgrade",
  "mise upgrade --local",
  "mise lock --yes",
  "mise lock --global --yes",
  "chezmoi re-add --source \"$PWD\" ~/.config/mise/mise.lock",
  "nvim --headless '+Lazy! update' +qa",
  "mise run vim:verify",
  "chezmoi re-add --source \"$PWD\" ~/.config/nvim/lazy-lock.json",
  "mise run tools",
]

[tasks.verify]
alias = "mx"
depends = ["build"]
description = "Run the dot sanity check suite"
run = "executable_dot verify"

[tasks.vim]
alias = "mv"
description = "Sync Neovim plugins headlessly (LazyVim)"
run = ["nvim --headless '+Lazy! restore' +qa", "mise run vim:verify"]

[tasks."vim:verify"]
description = "Verify every Lazy plugin checkout against the active lockfile"
run = "bash verify-lazy-lock.sh"
