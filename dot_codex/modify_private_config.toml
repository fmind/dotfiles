# chezmoi:modify-template
{{- $managedConfig := fromToml `
allow_login_shell = true
approval_policy = "never"
background_terminal_max_timeout = 1200000
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true
web_search = "live"

[agents]
default_subagent_reasoning_effort = "xhigh"
job_max_runtime_seconds = 10800
max_depth = 1
max_concurrent_threads_per_session = 4

[features]
code_mode = { enabled = true }
concurrent_reasoning_summaries = true
context_management = true
deferred_executor = true
fast_mode = false
memories = true
multi_agent_v2 = true
prevent_idle_sleep = true

[[hooks.PreCompact]]
matcher = ""

[[hooks.PreCompact.hooks]]
command = "dot agent hook session codex"
statusMessage = "Syncing Codex session"
timeout = 30
type = "command"

[[hooks.PreCompact.hooks]]
command = "dot agent hook usage codex"
statusMessage = "Reporting Codex usage"
timeout = 30
type = "command"

[[hooks.SessionEnd]]
matcher = ""

[[hooks.SessionEnd.hooks]]
command = "dot agent hook session codex"
statusMessage = "Syncing Codex session"
timeout = 3
type = "command"

[[hooks.SessionEnd.hooks]]
command = "dot agent hook usage codex"
statusMessage = "Reporting Codex usage"
timeout = 3
type = "command"

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
command = "dot agent hook session codex"
statusMessage = "Syncing Codex session"
timeout = 30
type = "command"

[[hooks.Stop.hooks]]
command = "dot agent hook notify codex stop"
statusMessage = "Notifying turn end"
timeout = 30
type = "command"

[[hooks.Stop.hooks]]
command = "dot agent hook usage codex"
statusMessage = "Reporting Codex usage"
timeout = 30
type = "command"

[memories]
generate_memories = true

[otel]
metrics_exporter = "none"
trace_exporter = "none"

[tools]
web_search = { context_size = "high" }

[tui]
vim_mode_default = true

` -}}
{{- $_ := set $managedConfig "log_dir" (joinPath .chezmoi.homeDir ".codex/log") -}}
{{- $_ = set $managedConfig "sqlite_home" (joinPath .chezmoi.homeDir ".codex/sqlite") -}}
{{- $base := env "FKF_BASE" | default (joinPath .chezmoi.homeDir "fmind/brain") -}}
{{- $_ = set $managedConfig "mcp_servers" (dict "fkf" (dict "command" "fkf" "args" (list "mcp" "serve" "--base" $base))) -}}
{{- /* personality is a default rather than a managed key: it seeds a fresh config, then
       stays whatever /personality last set it to. */ -}}
{{- includeTemplate "toml-merge.tmpl" (dict
      "stdin" .chezmoi.stdin
      "managed" $managedConfig
      "defaults" (dict "personality" "pragmatic")
      "prune" (list "agents.max_threads" "vim_mode_default" "tools.view_image")) -}}
