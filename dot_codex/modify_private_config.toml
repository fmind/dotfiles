{{ $currentConfig := dict -}}
{{- if ne (trim .chezmoi.stdin) "" -}}
{{-   $currentConfig = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $managedConfig := fromToml `
# chezmoi:modify-template
allow_login_shell = true
approval_policy = "never"
background_terminal_max_timeout = 1200000
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true
web_search = "live"
vim_mode_default = true

[agents]
# Long agent batches (e.g. a Fgentic runtime session: create cluster, reconcile,
# capture evidence for several issues, tear down) run past an hour; 3600 s cut
# them mid-batch and discarded cluster uptime already paid for.
job_max_runtime_seconds = 10800
max_depth = 1
# Repos that serialize their heavy gates behind a mutex gain nothing from a third
# concurrent tool-running thread, and this host has 14 GiB with no swap.
max_threads = 2

[features]
code_mode = { enabled = true }
fast_mode = false
memories = true

[[hooks.SessionEnd]]
matcher = ""

[[hooks.SessionEnd.hooks]]
command = "dot notify codex session-end"
statusMessage = "Notifying session end"
timeout = 30
type = "command"

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
command = "dot agent session codex"
statusMessage = "Syncing Codex session"
timeout = 30
type = "command"

[[hooks.Stop.hooks]]
command = "dot notify codex stop"
statusMessage = "Notifying turn end"
timeout = 30
type = "command"

[memories]
generate_memories = true

[otel]
metrics_exporter = "none"
trace_exporter = "none"

[tools]
web_search = { context_size = "high" }

[tui]

` -}}
{{- $_ := set $managedConfig "log_dir" (joinPath .chezmoi.homeDir ".codex/log") -}}
{{- $_ = set $managedConfig "sqlite_home" (joinPath .chezmoi.homeDir ".codex/sqlite") -}}
{{- $desiredConfig := mergeOverwrite (dict "personality" "pragmatic") (deepCopy $currentConfig) $managedConfig -}}
{{- if and (ne (trim .chezmoi.stdin) "") (deepEqual $currentConfig $desiredConfig) -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{ $desiredConfig | toToml -}}
{{- end -}}
